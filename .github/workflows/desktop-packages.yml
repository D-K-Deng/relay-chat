name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: RelayChat-Windows-x64
          - os: macos-15
            arch: arm64
            package: RelayChat-macOS-AppleSilicon
          - os: macos-15-intel
            arch: x86_64
            package: RelayChat-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller
          python scripts/build_windows.py
      - if: runner.os == 'macOS'
        run: python scripts/build_macos.py --arch ${{ matrix.arch }}
      - run: python scripts/smoke_desktop.py dist/${{ matrix.package }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.zip
          compression-level: 0
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RelayChat-*
          path: dist
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=relay-chat/ --output=dist/RelayChat-source.zip HEAD
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "Relay Chat $GITHUB_REF_NAME" --notes "English desktop apps for Windows and macOS, with local chat history, Codex handoffs, and an optional API credit estimate. Download the ZIP for your platform and follow the included setup guide."
          fi
