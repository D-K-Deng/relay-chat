<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f8f9f5">
  <title>Relay Chat | Local AI workspace</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg"><link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<div id="layout">
  <button class="scrim" id="scrim" aria-label="Close navigation"></button>
  <aside id="sidebar">
    <div class="brand"><img src="/mark.svg" alt=""><div><strong>Relay<span>Chat</span></strong><small>Your AI workspace</small></div></div>
    <div class="side-actions">
      <button class="primary nav-new" data-action="new"><i data-i="plus"></i><span>New chat</span><kbd>⌘ / Ctrl O</kbd></button>
      <button class="nav-link" data-action="temp" id="nav-temp"><i data-i="temp"></i><span>Temporary chat</span></button>
      <button class="nav-link" data-action="import"><i data-i="branch"></i><span>Continue from Codex</span></button>
    </div>
    <div class="history-top"><span>Chat history</span><button class="icon-btn small" id="search-open" title="Search chats (Ctrl / Cmd K)" aria-label="Search chats"><i data-i="search"></i></button></div>
    <div id="search-wrap" hidden><input id="history-search" type="search" aria-label="Search titles or messages" placeholder="Search titles or messages…"></div>
    <div id="history" aria-label="Chat history"></div>
    <div class="side-foot">
      <button class="nav-link" data-action="guide"><i data-i="book"></i><span>Setup guide</span><i data-i="chevron"></i></button>
      <button class="nav-link" data-action="settings"><i data-i="sliders"></i><span>Settings</span></button>
      <div class="local-label"><span class="live-dot"></span> Local workspace <b>RELAY 1.1</b></div>
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle-side" title="Toggle sidebar" aria-label="Toggle sidebar"><i data-i="panel"></i></button>
      <div class="crumb"><span>Workspace</span><b>/</b><strong id="crumb">New chat</strong></div>
      <button id="balance-pill" class="balance-pill" data-action="balance" aria-label="API balance"><i data-i="wallet"></i><b>API balance</b></button>
      <button id="connection" class="connection" data-action="guide"><span></span><b>Checking key</b></button>
      <button id="more" class="icon-btn" data-action="manage" title="Manage chat" aria-label="Manage chat" hidden><i data-i="more"></i></button>
    </header>
    <div id="stage" class="stage empty">
      <div id="thread" class="thread" hidden><div class="thread-inner" id="messages"></div></div>
      <div class="landing" id="landing">
        <div class="eyebrow"><span class="line-mark"></span><span id="hero-label">Personal workspace</span><b>/</b> RELAY DESK</div>
        <h1 id="hero-title">Where shall we start<span>?</span></h1>
        <p id="hero-copy">Start a new conversation or pick up where you left off in Codex.</p>
        <svg class="ribbon" viewBox="0 0 212 96" fill="none" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.35">
            <path d="M0 68C39 68 47 6 88 12s25 74 57 73 35-40 67-42"/>
            <path d="M0 72c42 0 50-60 88-55s27 70 57 65 37-38 67-35"/>
            <path d="M0 76c44-1 52-59 88-54s28 64 57 57 38-35 67-28"/>
            <path d="M0 80c47-2 54-57 88-53s29 59 57 49 39-30 67-21"/>
            <path d="M0 84c49-3 56-55 88-52s30 54 57 41 41-26 67-14"/>
            <path d="M0 88c52-4 59-53 88-51s32 47 57 33 42-21 67-7"/>
          </g>
          <circle cx="87" cy="12" r="4" fill="var(--gold)" stroke="var(--canvas)" stroke-width="2"/>
        </svg>
      </div>
      <div id="compose-block" class="compose-block">
        <div id="composer" class="composer">
          <div id="chips" class="chips"></div>
          <textarea id="draft" rows="2" aria-label="Message" placeholder="Ask a question or drop a file here…" autofocus></textarea>
          <div class="compose-tools">
            <button id="attach" class="icon-btn attach" title="Attach text or an image" aria-label="Add an attachment"><i data-i="plus"></i></button>
            <span class="tool-divider"></span>
            <button id="model" class="model" data-action="settings" title="Model and context settings"><i data-i="layers"></i><span>gpt-5.4-mini</span><i data-i="down"></i></button>
            <span class="enter-hint">Shift + Enter for a new line</span>
            <button id="send" class="send" aria-label="Send message" title="Send message" disabled><i data-i="up"></i></button>
          </div>
          <input id="files" type="file" multiple hidden>
        </div>
        <div class="compose-note" id="compose-note"><i data-i="lock"></i><span>Saved on this device · Uses your OpenAI API credits</span></div>
      </div>
      <div id="shortcuts" class="shortcuts">
        <button class="action-card" data-action="import"><span class="card-icon green"><i data-i="branch"></i></span><span><strong>Continue from Codex</strong><small>Bring in an earlier conversation</small></span><i data-i="arrow"></i></button>
        <button class="action-card" id="second-card" data-action="temp"><span class="card-icon clay"><i data-i="temp"></i></span><span><strong>Temporary chat</strong><small>Clears when you close this tab</small></span><i data-i="arrow"></i></button>
      </div>
    </div>
  </main>
</div>
<dialog id="dialog" aria-labelledby="modal-title"><div class="modal-head"><div><div id="modal-kicker" class="eyebrow"></div><h2 id="modal-title"></h2></div><button id="close-modal" class="icon-btn" aria-label="Close dialog" title="Close"><i data-i="x"></i></button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status"></div>
</body></html>
